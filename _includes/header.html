<header class="site-header" role="banner">

  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Colour theme: follow system">Theme: auto</button>
    <script>
      (function () {
        var order = ["auto", "light", "dark"];
        var btn = document.getElementById("theme-toggle");
        function current() {
          try { return localStorage.getItem("scree-theme") || "auto"; } catch (e) { return "auto"; }
        }
        function apply(t) {
          if (t === "auto") document.documentElement.removeAttribute("data-theme");
          else document.documentElement.setAttribute("data-theme", t);
          btn.textContent = "Theme: " + t;
          btn.setAttribute("aria-label", "Colour theme: " + (t === "auto" ? "follow system" : t));
        }
        apply(current());
        btn.addEventListener("click", function () {
          var next = order[(order.indexOf(current()) + 1) % order.length];
          try {
            if (next === "auto") localStorage.removeItem("scree-theme");
            else localStorage.setItem("scree-theme", next);
          } catch (e) {}
          apply(next);
        });
      })();
    </script>

    {%- comment -%} Pages are listed in the sidebar (_layouts/page.html). {%- endcomment -%}
  </div>
</header>
