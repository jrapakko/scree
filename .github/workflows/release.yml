name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The MCPB bundle for Claude Desktop and its sha256 (sha256sum
      # format), added to the draft. Publishing the draft runs registry.yml,
      # which lists the bundle with its sha256.
      - name: Build and upload the MCPB bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          one() {
            jq -er --arg t "$1" --arg os "$2" --arg arch "$3" '
              [.[] | select(.type == $t and .goos == $os and .goarch == $arch) | .path]
              | if length == 1 then .[0] else error("want one \($t) for \($os)/\($arch), found \(length)") end
            ' dist/artifacts.json
          }
          darwin=$(one Binary darwin all) # the universal binary: goreleaser types it Binary, goarch all
          windows=$(one Binary windows amd64)
          v=$(jq -er .version dist/metadata.json)
          scripts/mcpb.sh "$v" "$darwin" "$windows" "dist/scree_${v}.mcpb"
          (cd dist && sha256sum "scree_${v}.mcpb" > "scree_${v}.mcpb.sha256")
          gh release upload "$GITHUB_REF_NAME" "dist/scree_${v}.mcpb" "dist/scree_${v}.mcpb.sha256" --clobber

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
